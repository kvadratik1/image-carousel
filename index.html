<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image carousel</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="carousel">
      <div id="carousel-track">
        
        <div class="carousel-slide">
          <img src="https://images.pexels.com/photos/3927390/pexels-photo-3927390.jpeg " alt="" />
        </div>

        <div class="carousel-slide">
          <img src="https://images.pexels.com/photos/32734335/pexels-photo-32734335.jpeg" alt="" />
        </div>

        <div class="carousel-slide">
          <img src="https://images.pexels.com/photos/31295908/pexels-photo-31295908.jpeg " alt="" />
        </div>
       
        </div>
      </div>
      
      <button class="carousel-button" id="btnPrev">previous</button>
      <button class="carousel-button" id="btnNext">next</button>
    </div>
    <script src="index.js"></script>
  </body>
</html>
